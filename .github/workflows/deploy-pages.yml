name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Sent by the Sanity webhook when content is published (docs/PLANO-AREA-ADMIN.md).
  repository_dispatch:
    types: [sanity-content-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
          # Repository variables (not secrets): content is read from Sanity only
          # when SITE_CMS_ENABLED is "true"; otherwise the local data is used.
          SITE_CMS_ENABLED: ${{ vars.SITE_CMS_ENABLED || 'false' }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
