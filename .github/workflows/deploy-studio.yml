name: Deploy Sanity Studio

# Publishes the admin panel (Sanity Studio) to https://<SANITY_STUDIO_HOSTNAME>.sanity.studio.
# Runs only after the repository variables and the SANITY_AUTH_TOKEN secret are configured.
on:
  push:
    branches: ["main"]
    paths:
      - "sanity.config.ts"
      - "sanity.cli.ts"
      - "src/sanity/schemaTypes/**"
      - "src/sanity/structure.ts"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-studio
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.SANITY_PROJECT_ID != '' && vars.SANITY_STUDIO_HOSTNAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
          SANITY_STUDIO_HOSTNAME: ${{ vars.SANITY_STUDIO_HOSTNAME }}
          SANITY_STUDIO_BASE_PATH: "/"
        run: npx sanity deploy -y
